<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員情報変更</title>
</head>
<body>

<h1>会員情報変更</h1>

{% if error_message %}
    <p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="post" action="{% url 'users:updateUser' %}">
    {% csrf_token %}

    <div>
        <label>会員ID</label>
        <input type="text" name="user_id" value="{{ user.user_id }}" readonly>
    </div>

    <div>
        <label>新しいパスワード</label>
        <input type="password" name="password">
        <p>変更しない場合は空欄のままにしてください。</p>
    </div>

    <div>
        <label>新しいパスワード確認</label>
        <input type="password" name="confirm_password">
    </div>

    <div>
        <label>名前</label>
        <input type="text" name="name" value="{{ user.name }}" required>
    </div>

    <div>
        <label>住所</label>
        <input type="text" name="address" value="{{ user.address }}" required>
    </div>

    <button type="submit">変更</button>
</form>

<p>
    <a href="{% url 'users:withdrawConfirm' %}">退会する</a>
</p>

<p>
    <a href="{% url 'shopping:main' %}">検索画面に戻る</a>
</p>

</body>
</html>
