<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録内容確認</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .confirm-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .error-message {
            background: #fee;
            color: #c53030;
            border-left: 4px solid #c53030;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .confirm-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .item {
            margin-bottom: 18px;
        }

        .item:last-child {
            margin-bottom: 0;
        }

        .label {
            display: block;
            color: #718096;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            color: #2d3748;
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
        }

        .button-area {
            display: flex;
            gap: 12px;
        }

        .back-link,
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-link {
            background: #edf2f7;
            color: #4a5568;
            border: none;
        }

        .back-link:hover {
            background: #e2e8f0;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #ffffff;
            border: none;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        @media (max-width: 480px) {
            .confirm-container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 22px;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="confirm-container">
        <h1>登録内容確認</h1>
        <p class="subtitle">以下の内容で登録しますか？</p>

        {% if error_message %}
            <p class="error-message">{{ error_message }}</p>
        {% endif %}

        <div class="confirm-box">
            <div class="item">
                <span class="label">会員ID</span>
                <p class="value">{{ register_data.user_id }}</p>
            </div>

            <div class="item">
                <span class="label">名前</span>
                <p class="value">{{ register_data.name }}</p>
            </div>

            <div class="item">
                <span class="label">住所</span>
                <p class="value">{{ register_data.address }}</p>
            </div>

            <div class="item">
                <span class="label">パスワード</span>
                <p class="value">表示しません</p>
            </div>
        </div>

        <div class="button-area">
            <a href="{% url 'users:register' %}" class="back-link">修正する</a>

            <form method="post" style="width: 100%;">
                {% csrf_token %}
                <button type="submit">この内容で登録</button>
            </form>
        </div>
    </div>
</body>
</html>
