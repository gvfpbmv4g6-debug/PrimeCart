<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録完了</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            font-family: "Inter", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .complete-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 24px;
        }

        .complete-title {
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .complete-text {
            color: #64748b;
            margin-bottom: 32px;
        }

        .btn-login {
            border-radius: 999px;
            padding: 14px 28px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body>

    <main class="complete-card">
        <div class="success-icon">✓</div>

        <h1 class="complete-title">
            会員登録が完了しました
        </h1>

        <p class="complete-text">
            {{ register_name }}さん、登録ありがとうございます。<br>
            ログイン画面からサービスをご利用ください。
        </p>

        <a href="{% url 'users:login' %}" class="btn btn-primary btn-login w-100">
            ログイン画面へ
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
