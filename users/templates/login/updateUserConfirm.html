<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員情報変更確認</title>
</head>
<body>

<h1>会員情報変更確認</h1>

<p>以下の内容で変更します。よろしいですか？</p>

<form method="post" action="{% url 'users:updateUserConfirm' %}">
    {% csrf_token %}

    <table border="1">
        <tr>
            <th>会員ID</th>
            <td>{{ user.user_id }}</td>
        </tr>
        <tr>
            <th>パスワード</th>
            <td>
                {% if update_data.password_changed %}
                    変更する
                {% else %}
                    変更しない
                {% endif %}
            </td>
        </tr>
        <tr>
            <th>名前</th>
            <td>{{ update_data.name }}</td>
        </tr>
        <tr>
            <th>住所</th>
            <td>{{ update_data.address }}</td>
        </tr>
    </table>

    <button type="submit">確定</button>
</form>

<form method="get" action="{% url 'users:updateUser' %}">
    <button type="submit">戻る</button>
</form>

</body>
</html>
