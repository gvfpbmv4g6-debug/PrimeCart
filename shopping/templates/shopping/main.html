<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PrimeCart メイン</title>
</head>
<body>
<h1>PrimeCart</h1>

<header>
    {% if login_user_id %}
        <p>{{ login_name }} さん、ログイン中</p>

        <nav>
            <a href="{% url 'users:userInfo' %}">会員情報を見る</a>
            |
            <a href="{% url 'users:logout' %}">ログアウト</a> 
        </nav>
    {% else %}
        <nav>
            <a href="{% url 'users:login' %}">ログイン</a>
        </nav>
    {% endif %}
</header>

<hr>

<h2>商品検索</h2>

<form method="get" action="{% url 'shopping:search_result' %}">
    <div>
        <label for="category">カテゴリ</label>
        <select name="category" id="category">
            <option value="">すべて</option>

            {% for category in categories %}
                <option value="{{ category.category_id }}">
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="keyword">キーワード</label>
        <input type="text" name="keyword" id="keyword" placeholder="商品名を入力">
    </div>

    <button type="submit">検索</button>
</form>

</body>
</html>
