<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退会確認</title>
</head>
<body>
    <h1>退会確認</h1>

    <p>以下の会員情報を退会します。よろしいですか？</p>

    <table border="1">
        <tr>
            <th>会員ID</th>
            <td>{{ user.user_id }}</td>
        </tr>
        <tr>
            <th>名前</th>
            <td>{{ user.name }}</td>
        </tr>
        <tr>
            <th>住所</th>
            <td>{{ user.address }}</td>
        </tr>
    </table>

    <br>

    <form method="post" action="{% url 'users:withdrawConfirm' %}">
        {% csrf_token %}
        <button type="submit">退会する</button>
    </form>

    <p>
        <a href="{% url 'users:userInfo' %}">会員情報に戻る</a>
    </p>
</body>
</html>
