<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員情報</title>
</head>
<body>
    <h1>会員情報</h1>

    <table border="1">
        <tr>
            <th>会員ID</th>
            <td>{{ user.user_id }}</td>
        </tr>
        <tr>
            <th>パスワード</th>
            <td>表示なし</td>
        </tr>
        <tr>
            <th>名前</th>
            <td>{{ user.name }}</td>
        </tr>
        <tr>
            <th>住所</th>
            <td>{{ user.address }}</td>
        </tr>
    </table>

    <p>
        <a href="{% url 'users:updateUser' %}">会員情報の変更</a>
    </p>

    <p>
        <a href="{% url 'shopping:main' %}">検索画面に戻る</a>
    </p>

</body>
</html>
